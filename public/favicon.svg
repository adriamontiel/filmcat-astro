<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#0a0a0c"/>
  <defs>
    <linearGradient id="lg1" x1="15" y1="81" x2="85" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#922B21"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <linearGradient id="lg2" x1="50" y1="19" x2="15" y2="81" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C0392B" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#7B241C"/>
    </linearGradient>
  </defs>
  <!-- triangle scaled to 70% and centered (≈15px padding each side) -->
  <polygon points="50,19 85,81 15,81" fill="url(#lg1)"/>
  <polygon points="50,19 50,61 15,81" fill="url(#lg2)"/>
</svg>
