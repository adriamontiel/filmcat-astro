<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- dark rounded background -->
  <rect width="100" height="100" rx="22" fill="#0a0a0c"/>
  <defs>
    <linearGradient id="lg1" x1="0" y1="94" x2="100" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#922B21"/>
      <stop offset="100%" stop-color="#E74C3C"/>
    </linearGradient>
    <linearGradient id="lg2" x1="50" y1="6" x2="0" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C0392B" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#7B241C"/>
    </linearGradient>
  </defs>
  <!-- triangle centered vertically (88px tall → 6px top padding in 100px square) -->
  <g transform="translate(0,6)">
    <polygon points="50,0 100,88 0,88" fill="url(#lg1)"/>
    <polygon points="50,0 50,60 0,88" fill="url(#lg2)"/>
  </g>
</svg>
